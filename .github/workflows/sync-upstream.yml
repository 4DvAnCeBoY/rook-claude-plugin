# Keeps LambdaTest/rook-claude-plugin (the fork the Claude plugin directory
# follows) in step with 4DvAnCeBoY/rook-claude-plugin. The file lives in both
# repositories so the fork stays a fast-forward; it only runs in the fork.
name: Sync from upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'LambdaTest/rook-claude-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main --jq '.message'
